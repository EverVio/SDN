<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC // SDN Fat-Tree 运维控制台</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
</head>

<body>
    <!-- Atmospheric Effects -->
    <div class="crt-scanlines"></div>
    <div class="crt-vignette"></div>
    <div class="noise-overlay"></div>
    <div class="grid-overlay"></div>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <div class="logo-glyph">
                    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
                        <path d="M18 3L32 11V25L18 33L4 25V11L18 3Z" stroke="var(--accent)" stroke-width="1.2"
                            fill="none" opacity="0.5">
                            <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite" />
                        </path>
                        <path d="M18 7L28 13V23L18 29L8 23V13L18 7Z" stroke="var(--accent)" stroke-width="0.8"
                            fill="rgba(0,240,255,0.04)" />
                        <circle cx="18" cy="18" r="3.5" fill="var(--accent)" opacity="0.8">
                            <animate attributeName="r" values="3;4;3" dur="3s" repeatCount="indefinite" />
                        </circle>
                        <line x1="18" y1="7" x2="18" y2="14" stroke="var(--accent)" stroke-width="0.5" opacity="0.4" />
                        <line x1="18" y1="22" x2="18" y2="29" stroke="var(--accent)" stroke-width="0.5" opacity="0.4" />
                        <line x1="8" y1="13" x2="14" y2="18" stroke="var(--accent)" stroke-width="0.5" opacity="0.4" />
                        <line x1="22" y1="18" x2="28" y2="13" stroke="var(--accent)" stroke-width="0.5" opacity="0.4" />
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>NOC<span class="logo-sep">//</span>SDN</h1>
                    <span class="subtitle">FAT-TREE k=4 运维控制台</span>
                </div>
            </div>
        </div>
        <div class="header-center">
            <div class="status-chip" id="statusChip">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-label" id="statusText">待机</span>
                <span class="status-code" id="statusCode">00</span>
            </div>
        </div>
        <div class="header-right">
            <div class="header-meta">
                <span class="meta-item" id="clockDisplay">--:--:--</span>
                <span class="meta-sep">|</span>
                <span class="meta-item">节点 <span class="meta-val">36</span></span>
                <span class="meta-sep">|</span>
                <span class="meta-item">链路 <span class="meta-val">48</span></span>
            </div>
        </div>
    </header>

    <!-- ===== MAIN LAYOUT ===== -->
    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar sidebar-left">
            <!-- Experiment Control -->
            <div class="panel control-panel">
                <div class="panel-header">
                    <span class="panel-tag">01</span>
                    <h2>实验控制</h2>
                </div>
                <div class="panel-body">
                    <div class="form-group">
                        <label for="groupSelect">负载均衡策略</label>
                        <div class="select-wrap">
                            <select id="groupSelect">
                                <option value="l2">L2 基线 ECMP</option>
                                <option value="threshold">阈值响应（&gt;70%）</option>
                                <option value="predictive">MLP 预测式主动</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="durationSlider">持续时间</label>
                        <div class="duration-display">
                            <span class="duration-num" id="durationValue">60</span>
                            <span class="duration-unit">秒</span>
                        </div>
                        <input type="range" id="durationSlider" min="5" max="120" value="60" step="5">
                        <div class="slider-track-labels">
                            <span>5</span><span>30</span><span>60</span><span>90</span><span>120</span>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-start" id="btnStart" onclick="startExperiment()">
                            <span class="btn-glyph">&#9654;</span>
                            <span>执行</span>
                        </button>
                        <button class="btn btn-stop" id="btnStop" onclick="stopExperiment()" disabled>
                            <span class="btn-glyph">&#9632;</span>
                            <span>中止</span>
                        </button>
                    </div>
                    <div class="progress-section" id="progressSection" style="display:none">
                        <div class="progress-header">
                            <span class="progress-label">已用时间</span>
                            <span class="progress-time" id="progressElapsed">00:00</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" id="progressBar"></div>
                            <div class="progress-bar-scan"></div>
                        </div>
                        <div class="progress-footer">
                            <span id="progressRemaining">剩余：--秒</span>
                            <span id="progressPct">0%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Utilization Scale -->
            <div class="panel util-panel">
                <div class="panel-header">
                    <span class="panel-tag">02</span>
                    <h2>链路利用率</h2>
                </div>
                <div class="panel-body">
                    <div class="util-scale">
                        <div class="scale-bar">
                            <div class="scale-segment" style="background: var(--green)"></div>
                            <div class="scale-segment" style="background: var(--amber)"></div>
                            <div class="scale-segment" style="background: var(--red)"></div>
                        </div>
                        <div class="scale-labels">
                            <span>0%</span>
                            <span class="scale-threshold">30%</span>
                            <span class="scale-threshold">70%</span>
                            <span>100%</span>
                        </div>
                    </div>
                    <div class="util-legend-items">
                        <div class="legend-row">
                            <span class="legend-swatch" style="background: var(--green)"></span>
                            <span>正常 &lt;30%</span>
                        </div>
                        <div class="legend-row">
                            <span class="legend-swatch" style="background: var(--amber)"></span>
                            <span>升高 30-70%</span>
                        </div>
                        <div class="legend-row">
                            <span class="legend-swatch" style="background: var(--red)"></span>
                            <span>严重 &gt;70%</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Topology Canvas -->
        <main class="canvas-area">
            <div class="canvas-toolbar">
                <button class="tool-btn" onclick="cy.fit(80)" title="适配屏幕">
                    <span class="tb-icon">&#9634;</span> Fit
                </button>
                <button class="tool-btn" onclick="cy.zoom(cy.zoom()*1.3)" title="放大">
                    <span class="tb-icon">+</span>
                </button>
                <button class="tool-btn" onclick="cy.zoom(cy.zoom()/1.3)" title="缩小">
                    <span class="tb-icon">&minus;</span>
                </button>
                <div class="toolbar-sep"></div>
                <button class="tool-btn" onclick="resetHighlight()" title="重置">
                    <span class="tb-icon">&#8634;</span> Reset
                </button>
            </div>
            <!-- Canvas corner markers -->
            <div class="corner-mark tl"></div>
            <div class="corner-mark tr"></div>
            <div class="corner-mark bl"></div>
            <div class="corner-mark br"></div>
            <div id="cy"></div>
            <div id="weightOverlays"></div>
            <!-- Canvas status bar -->
            <div class="canvas-status">
                <span id="canvasZoom">缩放：100%</span>
                <span id="canvasNodes">节点：36</span>
                <span id="canvasEdges">链路：48</span>
            </div>
        </main>

        <!-- Right Sidebar -->
        <aside class="sidebar sidebar-right">
            <!-- Node Legend -->
            <div class="panel legend-panel">
                <div class="panel-header">
                    <span class="panel-tag">03</span>
                    <h2>拓扑图例</h2>
                </div>
                <div class="panel-body">
                    <div class="topo-legend">
                        <div class="tl-item"><span class="tl-swatch core-sw"></span><span class="tl-label">核心
                                交换机</span><span class="tl-count">4</span></div>
                        <div class="tl-item"><span class="tl-swatch agg-sw"></span><span
                                class="tl-label">汇聚交换机</span><span class="tl-count">8</span></div>
                        <div class="tl-item"><span class="tl-swatch edge-sw"></span><span class="tl-label">边缘
                                交换机</span><span class="tl-count">8</span></div>
                        <div class="tl-item"><span class="tl-swatch host-sw"></span><span
                                class="tl-label">主机</span><span class="tl-count">16</span></div>
                    </div>
                </div>
            </div>

            <!-- Event Log -->
            <div class="panel log-panel">
                <div class="panel-header">
                    <span class="panel-tag">04</span>
                    <h2>事件日志</h2>
                    <button class="log-clear" onclick="clearLog()">清空</button>
                </div>
                <div class="panel-body">
                    <div class="log-area" id="logArea"></div>
                </div>
            </div>
        </aside>
    </div>

    <!-- ===== RESULTS MODAL ===== -->
    <div class="modal-backdrop" id="resultsModal" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title-group">
                    <span class="modal-tag">报告</span>
                    <h2 id="modalTitle">实验结果</h2>
                </div>
                <button class="modal-close" onclick="closeModal()">&#10005;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-modal-close" onclick="closeModal()">确认</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>

</html>
