<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC // SDN Fat-Tree 控制台</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
</head>

<body>
    <!-- 极简流光背景装饰 -->
    <div class="ambient-glow bg-glow-1"></div>
    <div class="ambient-glow bg-glow-2"></div>
    <div class="noise-overlay-subtle"></div>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <div class="logo-glyph">
                    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
                        <!-- Modernized sleek geometric logo -->
                        <path d="M18 4L30 11V25L18 32L6 25V11L18 4Z" stroke="url(#logo-grad)" stroke-width="1.5" fill="rgba(20, 255, 200, 0.05)">
                            <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
                        </path>
                        <circle cx="18" cy="18" r="4" fill="url(#logo-grad)">
                            <animate attributeName="r" values="3.5;4.5;3.5" dur="2s" repeatCount="indefinite" />
                        </circle>
                        <defs>
                            <linearGradient id="logo-grad" x1="6" y1="4" x2="30" y2="32" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#00f2fe" />
                                <stop offset="100%" stop-color="#4facfe" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>NOC<span class="logo-sep">//</span>SDN</h1>
                    <span class="subtitle">FAT-TREE k=4</span>
                </div>
            </div>
        </div>
        <div class="header-center">
            <!-- 引擎状态监控已移至画布上方 HUD 悬浮指示器 -->
        </div>
        <div class="header-right">
            <div class="header-meta">
                <div class="meta-card">
                    <span class="meta-icon">◷</span>
                    <span class="meta-item" id="clockDisplay">--:--:--</span>
                </div>
                <div class="meta-card">
                    <span class="meta-icon">⎔</span>
                    <span class="meta-item">节点 <span class="meta-val">36</span></span>
                </div>
                <div class="meta-card">
                    <span class="meta-icon">⑄</span>
                    <span class="meta-item">链路 <span class="meta-val">48</span></span>
                </div>
            </div>
        </div>
    </header>

    <!-- ===== MAIN LAYOUT ===== -->
    <div class="main-layout">
        <!-- Sidebar Left -->
        <aside class="sidebar sidebar-left">
            <!-- Experiment Control -->
            <div class="glass-panel control-panel">
                <div class="panel-header">
                    <div class="header-title-wrap">
                        <span class="panel-indicator"></span>
                        <h2>实验控制</h2>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="form-group">
                        <label for="groupSelect">负载均衡策略</label>
                        <div class="select-wrap">
                            <select id="groupSelect">
                                <option value="l2">L2 Baseline (ECMP)</option>
                                <option value="threshold">Threshold Active (&gt;70%)</option>
                                <option value="predictive">MLP Predictive Routing</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="durationSlider">测试时长</label>
                        <div class="duration-display">
                            <span class="duration-num" id="durationValue">60</span>
                            <span class="duration-unit">sec</span>
                        </div>
                        <div class="slider-wrapper">
                            <input type="range" id="durationSlider" min="0" max="1000" value="231" step="1">
                        </div>
                        <div class="slider-track-labels">
                            <span>30s</span><span>1m</span><span>2m</span><span>5m</span><span>10m</span>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" id="btnStart" onclick="startExperiment()">
                            <span class="btn-icon">▶</span>
                            <span>初始化执行 (EXECUTE)</span>
                        </button>
                        <button class="btn btn-danger" id="btnStop" onclick="stopExperiment()" disabled>
                            <span class="btn-icon">■</span>
                            <span>紧急中止 (ABORT)</span>
                        </button>
                    </div>

                </div>
            </div>

            <!-- Utilization Scale -->
            <div class="glass-panel util-panel">
                <div class="panel-header">
                    <div class="header-title-wrap">
                        <span class="panel-indicator"></span>
                        <h2>链路监控</h2>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="util-scale-modern">
                        <div class="scale-bar-modern">
                            <div class="scale-seg seg-safe"></div>
                            <div class="scale-seg seg-warn"></div>
                            <div class="scale-seg seg-crit"></div>
                        </div>
                        <div class="scale-markers">
                            <span>0%</span>
                            <span class="marker">30%</span>
                            <span class="marker">70%</span>
                            <span>100%</span>
                        </div>
                    </div>
                    <div class="util-legend-grid">
                        <div class="legend-card safe">
                            <div class="lg-swatch"></div>
                            <div class="lg-text">
                                <span class="lg-title">正常</span>
                                <span class="lg-sub">&lt; 30%</span>
                            </div>
                        </div>
                        <div class="legend-card warn">
                            <div class="lg-swatch"></div>
                            <div class="lg-text">
                                <span class="lg-title">负载升高</span>
                                <span class="lg-sub">30 - 70%</span>
                            </div>
                        </div>
                        <div class="legend-card crit">
                            <div class="lg-swatch"></div>
                            <div class="lg-text">
                                <span class="lg-title">过载临界</span>
                                <span class="lg-sub">&gt; 70%</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Topology Canvas -->
        <main class="canvas-area">
            <div class="radar-grid"></div>
            
            <!-- HUD 抬头悬浮监控指示器 -->
            <div class="hud-console" id="hudConsole">
                <!-- 顶层核心指标行 -->
                <div class="hud-top-row">
                    <div class="hud-status-pill">
                        <div class="hud-indicator">
                            <span class="hud-dot" id="statusDot"></span>
                            <span class="hud-pulse"></span>
                        </div>
                        <span class="hud-label" id="statusText">System Standby</span>
                    </div>
                    
                    <div class="hud-timer-pill">
                        <span class="time-pulse-dot"></span>
                        <span class="hud-timer-num" id="progressElapsed">00:00</span>
                    </div>
                </div>
                
                <!-- 底层进度跟踪行（实验运行期间可见） -->
                <div class="hud-progress-row" id="hudProgressSection" style="display: none;">
                    <div class="hud-progress-track progress-track">
                        <div class="hud-progress-fill progress-fill" id="progressBar">
                            <div class="hud-progress-glow progress-glow"></div>
                        </div>
                    </div>
                    <div class="hud-progress-footer">
                        <span id="progressRemaining">Remaining: --</span>
                        <span id="progressPct" class="hud-pct-highlight">0%</span>
                    </div>
                </div>
            </div>
            
            <div class="canvas-toolbar">
                <button class="tool-btn" onclick="cy.fit(80)" title="适配屏幕">
                    ⛶ FIT
                </button>
                <div class="toolbar-sep"></div>
                <button class="tool-btn icon-only" onclick="cy.zoom(cy.zoom()*1.3)" title="放大">+</button>
                <button class="tool-btn icon-only" onclick="cy.zoom(cy.zoom()/1.3)" title="缩小">−</button>
                <div class="toolbar-sep"></div>
                <button class="tool-btn" onclick="resetHighlight()" title="重置状态">
                    ↺ RESET
                </button>
            </div>
            
            <div id="cy"></div>
            <div id="weightOverlays"></div>
            
            <div class="canvas-status">
                <div class="status-pill"><span class="pill-dot"></span><span id="canvasZoom">Zoom: 100%</span></div>
                <div class="status-pill"><span class="pill-dot"></span><span id="canvasNodes">Nodes: 36</span></div>
                <div class="status-pill"><span class="pill-dot"></span><span id="canvasEdges">Links: 48</span></div>
            </div>
        </main>

        <!-- Sidebar Right -->
        <aside class="sidebar sidebar-right">
            <!-- Node Legend -->
            <div class="glass-panel legend-panel">
                <div class="panel-header">
                    <div class="header-title-wrap">
                        <span class="panel-indicator"></span>
                        <h2>拓扑图例</h2>
                    </div>
                </div>
                <div class="panel-body p-sm">
                    <div class="topo-legend-modern">
                        <div class="tl-row core">
                            <div class="tl-icon"></div>
                            <div class="tl-info">
                                <span>核心层</span>
                                <span class="tl-count">x4</span>
                            </div>
                        </div>
                        <div class="tl-row agg">
                            <div class="tl-icon"></div>
                            <div class="tl-info">
                                <span>汇聚层</span>
                                <span class="tl-count">x8</span>
                            </div>
                        </div>
                        <div class="tl-row edge">
                            <div class="tl-icon"></div>
                            <div class="tl-info">
                                <span>边缘层</span>
                                <span class="tl-count">x8</span>
                            </div>
                        </div>
                        <div class="tl-row host">
                            <div class="tl-icon"></div>
                            <div class="tl-info">
                                <span>终端节点</span>
                                <span class="tl-count">x16</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Event Log -->
            <div class="glass-panel log-panel">
                <div class="panel-header">
                    <div class="header-title-wrap">
                        <span class="panel-indicator"></span>
                        <h2>系统终端</h2>
                    </div>
                    <button class="btn-ghost" onclick="clearLog()">CLEAR</button>
                </div>
                <div class="panel-body p-0">
                    <div class="terminal-area" id="logArea"></div>
                </div>
            </div>
        </aside>
    </div>

    <!-- ===== RESULTS MODAL ===== -->
    <div class="modal-backdrop" id="resultsModal" style="display:none">
        <div class="modal-glass">
            <div class="modal-header">
                <div class="m-title">
                    <span class="m-icon">📊</span>
                    <h2 id="modalTitle">Analysis Report</h2>
                </div>
                <button class="m-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-primary btn-block" onclick="closeModal()">CONFIRM & CLOSE</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
